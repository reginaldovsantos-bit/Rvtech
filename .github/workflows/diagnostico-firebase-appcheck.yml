name: Diagnóstico Firebase App Check RVTEC
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnostico-firebase-appcheck.yml'
      - 'scripts/diagnose_firebase_appcheck.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte de produção 1.6.5
        run: |
          set -e
          unzip -q 'RVTEC_1.6.2_ALERTA_OS_FONTE.zip'
          python3 scripts/patch-rvtec-163.py
          python3 scripts/patch-rvtec-164.py
      - name: Inspecionar integração Firebase
        run: |
          mkdir -p diagnostico
          python3 scripts/diagnose_firebase_appcheck.py | tee diagnostico/firebase-appcheck.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RVTEC-DIAGNOSTICO-FIREBASE-APPCHECK
          path: diagnostico/firebase-appcheck.txt
          if-no-files-found: error
          retention-days: 7

