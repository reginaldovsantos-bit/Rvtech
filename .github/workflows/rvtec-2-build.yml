name: RVTEC 2.0 Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'rvtec-2.0/**'
      - '.github/workflows/rvtec-2-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build RVTEC 2.0 debug APK
        working-directory: rvtec-2.0
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rvtec-2.0-debug
          path: rvtec-2.0/app/build/outputs/apk/debug/app-debug.apk
