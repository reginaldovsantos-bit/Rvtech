name: Build RVTEC 1.6.4 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-rvtec-163.yml'
      - 'scripts/patch-rvtec-163.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract and patch 1.6.2 copy
        run: |
          unzip -q RVTEC_1.6.2_ALERTA_OS_FONTE.zip
          python3 scripts/patch-rvtec-163.py
          python3 scripts/patch-rvtec-164.py
          test "$(grep -o "versionName '1.6.4'" RVTEC_Android/app/build.gradle | wc -l)" -eq 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: RVTEC_Android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK
        working-directory: RVTEC_Android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.6.4-APK-TESTE
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
