name: Build RVTEC 1.5.9 APK (Firebase fixes)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_1.5.9.html'
      - 'RVTEC_1.4.7_FONTE_CORRIGIDA.zip'
      - '.github/workflows/build-rvtec-159.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android source + RVTEC 1.5.9
        run: |
          set -euo pipefail
          unzip -o RVTEC_1.4.7_FONTE_CORRIGIDA.zip -d buildsrc
          APP=buildsrc/RVTEC_Android
          test -f "$APP/app/src/main/java/com/rvtec/manutencao/MainActivity.java"
          test -f "$APP/app/google-services.json"
          cp RVTEC_1.5.9.html "$APP/app/src/main/assets/index.html"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("buildsrc/RVTEC_Android/app/build.gradle")
          lines = gradle.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith("versionCode"):
                  lines[i] = "        versionCode 159"
              elif line.strip().startswith("versionName"):
                  lines[i] = "        versionName '1.5.9'"
          gradle.write_text("\n".join(lines) + "\n")

          p = Path("buildsrc/RVTEC_Android/app/src/main/java/com/rvtec/manutencao/MainActivity.java")
          s = p.read_text()
          s = s.replace("import android.webkit.WebViewClient;", "import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\nimport android.view.View;")
          s = s.replace("private static final int PHOTO_CAMERA = 703;", "private static final int PHOTO_CAMERA = 703;\n    private static final int AUDIO_PERMISSION = 701;\n    private PermissionRequest pendingAudioRequest;")
          old = """        webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.getResources());
                              } else {
                                  request.deny();
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 701);
                              }
                          });
                      }
                  });
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 701);
                  }
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("https://wa.me/") || url.startsWith("whatsapp://") ||
                              url.startsWith("mailto:") || url.startsWith("tel:")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                              catch (Exception ignored) { }
                              return true;
                          }
                          return false;
                      }
                  });"""
          new = """        webView.setWebChromeClient(new WebChromeClient() {
            @Override public void onPermissionRequest(PermissionRequest request) {
                runOnUiThread(() -> {
                    boolean asksAudio = false;
                    for (String resource : request.getResources()) {
                        if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) asksAudio = true;
                    }
                    if (!asksAudio) { request.deny(); return; }
                    if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                        request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                    } else {
                        pendingAudioRequest = request;
                        requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_PERMISSION);
                    }
                });
            }
        });
        webView.setOnApplyWindowInsetsListener((view, insets) -> {
            view.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                    insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
            return insets;
        });
        webView.requestApplyInsets();
        webView.setWebViewClient(new WebViewClient() {
            private boolean handleNavigation(String rawUrl) {
                if ("file:///android_asset/index.html".equals(rawUrl)) return false;
                try {
                    Uri uri = Uri.parse(rawUrl);
                    String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                    if ("https".equals(scheme) || "http".equals(scheme) || "whatsapp".equals(scheme)
                            || "mailto".equals(scheme) || "tel".equals(scheme)) {
                        startActivity(new Intent(Intent.ACTION_VIEW, uri));
                    }
                } catch (Exception ignored) { }
                return true;
            }
            @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                return handleNavigation(url);
            }
            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                return handleNavigation(request.getUrl().toString());
            }
        });"""
          if old not in s:
              raise SystemExit("Não localizei o bloco de permissões/navegação esperado em MainActivity.java; build interrompido.")
          s = s.replace(old, new)
          anchor = "    @Override\n    protected void onActivityResult(int requestCode, int resultCode, Intent data) {"
          permission = """    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults);
        if (requestCode == AUDIO_PERMISSION && pendingAudioRequest != null) {
            PermissionRequest request = pendingAudioRequest;
            pendingAudioRequest = null;
            if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
            } else {
                request.deny();
            }
        }
    }

"""
          if anchor not in s:
              raise SystemExit("Não localizei ponto para inserir retorno da permissão de áudio.")
          s = s.replace(anchor, permission + anchor)
          s = s.replace("if (safePrompt.length() > 20000) safePrompt = safePrompt.substring(0, 20000);",
                        "if (safePrompt.length() > 30000) safePrompt = safePrompt.substring(0, 30000);")
          p.write_text(s)
          PY
          python3 scripts/patch_android_159.py "$APP"
          grep -n "versionCode\|versionName\|AUDIO_PERMISSION\|30000" "$APP/app/build.gradle" "$APP/app/src/main/java/com/rvtec/manutencao/MainActivity.java"
      - name: Compile debug APK
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug --stacktrace
      - name: Validate APK
        run: |
          set -euo pipefail
          APK=buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.5.9-APK-Firebase-TESTE
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
