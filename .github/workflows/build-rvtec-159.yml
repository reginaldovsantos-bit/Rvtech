name: Build RVTEC 1.5.9 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_1.5.9.html'
      - 'RVTEC_1.4.7_FONTE_CORRIGIDA.zip'
      - 'scripts/patch_android_159.py'
      - '.github/workflows/build-rvtec-159.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile RVTEC 1.5.9
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare current RVTEC app in Android shell
        shell: bash
        run: |
          set -euxo pipefail
          test -s RVTEC_1.5.9.html
          test -s RVTEC_1.4.7_FONTE_CORRIGIDA.zip
          test -s scripts/patch_android_159.py
          unzip -q RVTEC_1.4.7_FONTE_CORRIGIDA.zip -d buildsrc
          APP=buildsrc/RVTEC_Android
          test -s "$APP/app/src/main/java/com/rvtec/manutencao/MainActivity.java"
          test -s "$APP/app/google-services.json"
          mkdir -p "$APP/app/src/main/assets"
          cp RVTEC_1.5.9.html "$APP/app/src/main/assets/index.html"
          python3 scripts/patch_android_159.py "$APP"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/RVTEC_Android/app/build.gradle")
          lines = p.read_text().splitlines()
          code_found = False
          name_found = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("versionCode "):
                  lines[i] = "        versionCode 159"
                  code_found = True
              elif stripped.startswith("versionName "):
                  lines[i] = "        versionName '1.5.9'"
                  name_found = True
          if not code_found or not name_found:
              raise SystemExit("Não foi possível localizar versionCode/versionName no build.gradle.")
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Compile debug APK
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.5.9-APK-TESTE
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
