name: Compilar APK RVTEC 1.5.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'rvtec-149-base-*.b64'
      - 'rvtec-149b.patch.gz.b64'
      - 'rvtec-150.patch.gz.b64'
      - 'RVTEC_1.4.8_GRAFICOS_FONTE.zip'
      - '.github/workflows/build-rvtec-149.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto-base 1.4.8
        run: unzip -o RVTEC_1.4.8_GRAFICOS_FONTE.zip -d buildsrc
      - name: Aplicar alterações anteriores e novo visual
        shell: bash
        run: |
          set -euo pipefail
          cat rvtec-149-base-1.b64 rvtec-149-base-2.b64 rvtec-149-base-3.b64 rvtec-149-base-4.b64 > rvtec-149-base.b64
          base64 -d rvtec-149-base.b64 > rvtec-149-base.gz
          gzip -t rvtec-149-base.gz
          gzip -dc rvtec-149-base.gz > rvtec-149-base.patch
          patch --batch -p1 -d buildsrc < rvtec-149-base.patch
          base64 -d rvtec-149b.patch.gz.b64 > rvtec-149b.gz
          gzip -t rvtec-149b.gz
          gzip -dc rvtec-149b.gz > rvtec-149b.patch
          patch --batch -p1 -d buildsrc < rvtec-149b.patch
          base64 -d rvtec-150.patch.gz.b64 > rvtec-150.gz
          gzip -t rvtec-150.gz
          gzip -dc rvtec-150.gz > rvtec-150.patch
          patch --batch -p1 -d buildsrc < rvtec-150.patch
      - name: Atualizar versão e validar projeto
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/rvtec/manutencao/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 12", "versionCode 13", 1)
          s=s.replace("versionName '1.4.9'", "versionName '1.5.0'", 1)
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker="android {"
              pos=s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado")
              pos += len(marker)
              s=s[:pos] + "\n    buildFeatures { buildConfig true }" + s[pos:]
          p.write_text(s)
          html=Path("app/src/main/assets/index.html").read_text()
          assert 'id="configuracoes"' in html
          assert 'data-tab="configuracoes"' in html
          assert 'id="solicitacoes"' not in html
          assert 'value="mtbf"' in html and 'value="mttr"' in html
          assert 'chartCompare' in html
          assert 'rvtec-visual-redesign-150' in html
          assert 'rvtecSettingsTop' in html
          print("RVTEC 1.5.0 validado")
          PY
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK RVTEC 1.5.0
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.5.0-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
