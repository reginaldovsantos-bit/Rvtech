name: Compilar APK RVTEC 1.4.9

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'rvtec-149.patch.gz.b64'
      - 'rvtec-149b.patch.gz.b64'
      - 'RVTEC_1.4.8_GRAFICOS_FONTE.zip'
      - '.github/workflows/build-rvtec-149.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto-base 1.4.8
        run: unzip -o RVTEC_1.4.8_GRAFICOS_FONTE.zip -d buildsrc
      - name: Aplicar alterações RVTEC 1.4.9
        shell: bash
        run: |
          set -euo pipefail
          base64 -d rvtec-149.patch.gz.b64 | gzip -d > rvtec-149.patch
          patch --batch -p1 -d buildsrc < rvtec-149.patch
          base64 -d rvtec-149b.patch.gz.b64 | gzip -d > rvtec-149b.patch
          patch --batch -p1 -d buildsrc < rvtec-149b.patch
      - name: Atualizar versão e validar projeto
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/rvtec/manutencao/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode 12", s, count=1)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '1.4.9'", s, count=1)
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker="android {"
              pos=s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado")
              pos += len(marker)
              s=s[:pos] + "\n    buildFeatures { buildConfig true }" + s[pos:]
          p.write_text(s)
          html=Path("app/src/main/assets/index.html").read_text()
          assert 'id="configuracoes"' in html
          assert 'data-tab="configuracoes"' in html
          assert 'id="solicitacoes"' not in html
          assert 'value="mtbf"' in html and 'value="mttr"' in html
          assert 'chartCompare' in html
          print("RVTEC 1.4.9 validado")
          PY
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK RVTEC 1.4.9
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.9-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
