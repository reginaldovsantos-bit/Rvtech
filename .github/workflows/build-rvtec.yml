name: Build RVTEC 1.4.4 Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_1.4.4_CORRIGIDO.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto RVTEC 1.4.4
        run: unzip -o RVTEC_1.4.4_CORRIGIDO.zip -d buildsrc
      - name: Validar estrutura e habilitar BuildConfig
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker = "android {"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado no app/build.gradle")
              pos += len(marker)
              s = s[:pos] + "\n    buildFeatures { buildConfig true }" + s[pos:]
              p.write_text(s)
          PY
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK 1.4.4
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.4-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
