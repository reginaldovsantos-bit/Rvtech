name: Build RVTEC 1.3.3 Gemini App Check
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_Android_v1.3.3_GEMINI_APPCHECK.zip'
      - '.github/workflows/build-rvtec.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto com Gemini e App Check
        run: unzip -o RVTEC_Android_v1.3.3_GEMINI_APPCHECK.zip -d buildsrc
      - name: Habilitar geração do BuildConfig
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker = "android {"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado no app/build.gradle")
              pos += len(marker)
              s = s[:pos] + "\n    buildFeatures { buildConfig true }" + s[pos:]
              p.write_text(s)
          print("BuildConfig habilitado.")
          PY
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.3.3-Gemini-AppCheck-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
