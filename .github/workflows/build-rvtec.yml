name: Build APK RVTEC 1.3.2 App Check
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_Android_v1.3.2_AppCheck_PREPARADO.zip'
      - '.github/workflows/build-rvtec.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto RVTEC 1.3.2
        run: unzip -o RVTEC_Android_v1.3.2_AppCheck_PREPARADO.zip -d buildsrc
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.3.2-AppCheck-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
