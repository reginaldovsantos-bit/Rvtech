name: Build APK RVTEC gratuito
on:
  workflow_dispatch:
  push:
    paths:
      - 'RVTEC_Android_v1.1_LOGIN_IA.zip'
      - '.github/workflows/build-rvtec.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: unzip -o RVTEC_Android_v1.1_LOGIN_IA.zip -d buildsrc
      - name: Compilar APK
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.1-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
