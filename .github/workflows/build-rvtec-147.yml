name: Compilar APK RVTEC 1.4.7

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_1.4.7_COMPLETO_FONTE.zip'
      - '.github/workflows/build-rvtec-147.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto RVTEC 1.4.7
        run: unzip -o RVTEC_1.4.7_COMPLETO_FONTE.zip -d buildsrc
      - name: Validar projeto e ajustar versão
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          lines = p.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if "versionName" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + "versionName '1.4.7'"
                  found = True
                  break
          if not found:
              raise SystemExit("versionName não encontrado em app/build.gradle")
          s = "\n".join(lines)
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker = "android {"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado")
              pos += len(marker)
              s = s[:pos] + "\n    buildFeatures { buildConfig true }" + s[pos:]
          p.write_text(s + "\n")
          print("Versão 1.4.7 configurada")
          PY
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK 1.4.7
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.7-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
