name: Compilar APK RVTEC 1.4.7

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_1.4.7_COMPLETO_FONTE.zip'
      - '.github/workflows/build-rvtec-147.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto RVTEC 1.4.7
        run: unzip -o RVTEC_1.4.7_COMPLETO_FONTE.zip -d buildsrc
      - name: Validar projeto e configurar versão
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          if not re.search(r"versionCode\s+\d+", s):
              raise SystemExit("versionCode não encontrado")
          if not re.search(r"versionName\s+['\"][^'\"]+['\"]", s):
              raise SystemExit("versionName não encontrado")
          s = re.sub(r"versionCode\s+\d+", "versionCode 11", s, count=1)
          s = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '1.4.7'", s, count=1)
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker = "android {"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado")
              pos += len(marker)
              s = s[:pos] + "\n    buildFeatures { buildConfig true }" + s[pos:]
          p.write_text(s)
          print("versionCode 11 e versionName 1.4.7 configurados")
          PY
      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug
      - name: Publicar APK 1.4.7
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.7-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
