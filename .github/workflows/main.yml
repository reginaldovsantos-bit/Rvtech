name: Gerar APK RVTEC Firebase

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'RVTEC_FIREBASE_PREPARADO.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto RVTEC com Firebase
        run: |
          ZIP="RVTEC_FIREBASE_PREPARADO.zip"
          test -f "$ZIP" || { echo "Arquivo $ZIP não encontrado"; exit 1; }
          unzip -o "$ZIP" -d .

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p RVTEC_Android assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-APK-FIREBASE
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
