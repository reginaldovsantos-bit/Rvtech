name: Gerar APK RVTEC com login separado

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'RVTEC_LOGIN_SEPARADO_PREPARADO.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto RVTEC com login separado
        run: |
          ZIP="RVTEC_LOGIN_SEPARADO_PREPARADO.zip"
          test -f "$ZIP" || { echo "Arquivo $ZIP não encontrado"; exit 1; }
          unzip -o "$ZIP" -d .

      - name: Corrigir ponte nativa de retorno ao login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("RVTEC_Android/app/src/main/java/com/rvtec/manutencao/MainActivity.java")
          s = p.read_text()
          if "class Bridge" not in s:
              pos = s.rfind("}")
              if pos < 0:
                  raise SystemExit("Fechamento da MainActivity não encontrado")
              bridge = '''
              private class Bridge {
                  @JavascriptInterface
                  public void returnToLogin() {
                      runOnUiThread(() -> finish());
                  }
              }
          '''
              s = s[:pos] + bridge + s[pos:]
              p.write_text(s)
          PY

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p RVTEC_Android assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-APK-LOGIN-SEPARADO
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
