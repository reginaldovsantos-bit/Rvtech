name: Compilar APK RVTEC - perfis exclusivos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o RVTEC_LOGIN_SEPARADO_PREPARADO.zip -d .


      - name: Atualizar login com Técnico, Produção e Gerência
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("RVTEC_Android/app/src/main/assets/login.html")
          s=p.read_text()
          s=s.replace(
            '<label for="email">E-mail</label>',
            '<label for="profile">Perfil de acesso</label><select id="profile" required><option value="">Selecione seu perfil</option><option value="tecnico">Técnico</option><option value="producao">Produção</option><option value="gerencia">Gerência</option></select>\\n<label for="email">E-mail</label>',
            1
          )
          s=s.replace(
            'input{width:100%;padding:13px;border:1px solid #d3dde6;border-radius:10px;font:inherit}',
            'input,select{width:100%;padding:13px;border:1px solid #d3dde6;border-radius:10px;font:inherit;background:#fff}',
            1
          )
          new_validate="""async function validateAndOpen(user){
           if(!user)return;
           const selected=document.getElementById('profile').value;
           if(!selected){msg('Selecione Técnico, Produção ou Gerência antes de entrar.');return;}
           try{
            const d=await db.collection('rvtec_users').doc(user.uid).get();
            if(!d.exists||d.data().active===false){await auth.signOut();msg('Usuário sem perfil ativo. Procure a gerência.');return;}
            const actual=d.data().role;
            const allowed={tecnico:['electrician'],producao:['production'],gerencia:['supervisor','admin']};
            if(!(allowed[selected]||[]).includes(actual)){
             await auth.signOut();
             msg('O perfil selecionado não corresponde ao seu cadastro no RVTEC. Selecione o perfil correto ou procure a gerência.');
             return;
            }
            if(window.RVTECNative)RVTECNative.openApp();
           }catch(e){msg('Não foi possível validar seu perfil: '+(e.message||e));}
          }"""
          import re
          s,n=re.subn(r"async function validateAndOpen\\(user\\)\\{.*?\\n\\}",new_validate,s,count=1,flags=re.S)
          if n!=1: raise SystemExit("Função de validação original não encontrada; login não alterado.")
          s=s.replace(
            "async function login(){const b=document.getElementById('enter');b.disabled=true;msg('Validando acesso...');",
            "async function login(){const b=document.getElementById('enter');if(!document.getElementById('profile').value){msg('Selecione seu perfil de acesso.');return;}b.disabled=true;msg('Validando acesso...');",
            1
          )
          if 'value="tecnico">Técnico' not in s or 'value="gerencia">Gerência' not in s:
           raise SystemExit("Não foi possível confirmar as três opções do login.")
          p.write_text(s)
          PY

      - name: Aplicar telas exclusivas por perfil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("RVTEC_Android/app/src/main/assets/index.html")
          s=p.read_text()
          roles="""const roleTabs={
           admin:['inicio','solicitacoes','paradas','responsaveis','maquinas','diagnosticos','iaRvtec','ordens','preventivas','relatorios','diagnosticoNuvem'],
           supervisor:['inicio','solicitacoes','paradas','responsaveis','maquinas','diagnosticos','iaRvtec','ordens','preventivas','relatorios'],
           electrician:['solicitacoes','paradas','diagnosticos','iaRvtec','ordens','preventivas'],
           production:['solicitacoes']
          };"""
          s,n=re.subn(r"const roleTabs\s*=\s*\{.*?\};",roles,s,count=1,flags=re.S)
          if n!=1: raise SystemExit("Não foi possível localizar a matriz de permissões.")
          s=s.replace("const adminPanel=$('adminUsers');if(adminPanel)adminPanel.style.display=role==='admin'?'block':'none';","const adminPanel=$('adminUsers');if(adminPanel)adminPanel.style.display=role==='admin'?'block':'none';")
          p.write_text(s)
          PY

      - name: Corrigir ponte nativa do WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("RVTEC_Android/app/src/main/java/com/rvtec/manutencao/MainActivity.java")
          s=p.read_text()
          if "class Bridge" not in s:
              pos=s.rfind("}")
              if pos < 0: raise SystemExit("MainActivity.java inválido")
              bridge='''
              private class Bridge {
                  @android.webkit.JavascriptInterface
                  public void returnToLogin() {
                      runOnUiThread(() -> finish());
                  }
              }
          '''
              s=s[:pos]+bridge+s[pos:]
              p.write_text(s)
          PY

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p RVTEC_Android assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-APK-PERFIS-EXCLUSIVOS
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
