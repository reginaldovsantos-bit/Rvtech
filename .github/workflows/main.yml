name: Gerar APK RVTEC

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'RVTEC_Android_Projeto_ICONE_NOVO.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android com novo ícone
        run: |
          ZIP="RVTEC_Android_Projeto_ICONE_NOVO.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Arquivo $ZIP não encontrado"
            exit 1
          fi
          unzip -o "$ZIP" -d .

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p RVTEC_Android assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-APK-NOVO-ICONE
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
