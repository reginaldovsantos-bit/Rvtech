name: Compilar APK RVTEC 1.4.5

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RVTEC_1.4.5_MENU_ROLAGEM_CORRIGIDA_FONTE.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto RVTEC 1.4.5
        run: unzip -o RVTEC_1.4.5_MENU_ROLAGEM_CORRIGIDA_FONTE.zip -d buildsrc

      - name: Atualizar versão e habilitar BuildConfig
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 10", "versionCode 11")
          s = s.replace("versionName '1.4.4'", "versionName '1.4.5'")
          if "buildConfig true" not in s and "buildConfig = true" not in s:
              marker = "android {"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("Bloco android não encontrado")
              pos += len(marker)
              s = s[:pos] + "\\n    buildFeatures { buildConfig true }" + s[pos:]
          p.write_text(s)
          PY

      - name: Compilar APK debug
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.5-debug
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
