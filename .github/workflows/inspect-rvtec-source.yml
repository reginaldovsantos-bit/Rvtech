name: Inspect RVTEC technician view
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-rvtec-source.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q RVTEC_1.6.2_ALERTA_OS_FONTE.zip
          F=RVTEC_Android/app/src/main/assets/index.html
          echo '--- CSS ORDER STYLES ---'
          grep -inE 'rvtec-os|order-card|orderList|details|summary' "$F" | head -60
          echo '--- ORDER RENDER ---'
          sed -n '1095,1135p' "$F"
          echo '--- STOP LIST RENDER / FUNCTIONS ---'
          grep -inE 'function renderStops|function renderOrders|function render\(|function applyPermissions|function canEditData|rvtecFinishOrder|rvtecSaveOrderDetails' "$F"
          echo '--- HTML ORDER PANEL ---'
          sed -n '290,325p' "$F"
          echo '--- STOP AND ORDER RENDER ---'
          sed -n '800,845p' "$F"
          sed -n '1220,1260p' "$F"
          echo '--- ORDER DETAILS SAVE / FINISH ---'
          sed -n '1030,1060p' "$F"
