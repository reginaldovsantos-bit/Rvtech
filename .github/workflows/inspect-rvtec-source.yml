name: Inspect RVTEC OS source details
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-rvtec-source.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print OS functions
        run: |
          unzip -q RVTEC_1.6.2_ALERTA_OS_FONTE.zip
          F=RVTEC_Android/app/src/main/assets/index.html
          for R in '980,1065' '1110,1170' '620,670' '800,845'; do
            echo "--- LINES $R ---"
            sed -n "${R}p" "$F"
          done
