name: Build RVTEC 1.6.0 APK
on:
  workflow_dispatch:
  push:
    branches: [ rvtec-1.6.0-professional-review ]
    paths:
      - 'RVTEC_1.6.0.html'
      - 'RVTEC_1.4.7_FONTE_CORRIGIDA.zip'
      - 'scripts/patch_android_160.py'
      - '.github/workflows/build-rvtec-160.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -s RVTEC_1.6.0.html
          test -s RVTEC_1.4.7_FONTE_CORRIGIDA.zip
          unzip -q RVTEC_1.4.7_FONTE_CORRIGIDA.zip -d buildsrc
          APP=buildsrc/RVTEC_Android
          test -s "$APP/app/src/main/java/com/rvtec/manutencao/MainActivity.java"
          test -s "$APP/app/google-services.json"
          mkdir -p "$APP/app/src/main/assets"
          cp RVTEC_1.6.0.html "$APP/app/src/main/assets/index.html"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("buildsrc/RVTEC_Android/app/build.gradle")
          lines=p.read_text().splitlines()
          code=name=0
          for i,line in enumerate(lines):
              if line.strip().startswith("versionCode"):
                  lines[i]="        versionCode 160"; code+=1
              elif line.strip().startswith("versionName"):
                  lines[i]="        versionName '1.6.0'"; name+=1
          if code != 1 or name != 1:
              raise SystemExit(f"Metadados Android inesperados: versionCode={code}, versionName={name}")
          p.write_text("\n".join(lines)+"\n")
          PY
          python3 scripts/patch_android_160.py "$APP"
          grep -n "versionCode 160\|versionName '1.6.0'" "$APP/app/build.gradle"
      - name: Compile APK
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.6.0-APK-TESTE
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
