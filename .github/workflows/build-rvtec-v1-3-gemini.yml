name: Build RVTEC v1.3 Gemini APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RVTEC_Android_v1.3_GEMINI_SEM_CLOUD(1).zip'
      - '.github/workflows/build-rvtec-v1-3-gemini.yml'
      - 'scripts/fix_rvtec_v13_firebase_ai.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract RVTEC source
        run: unzip -q 'RVTEC_Android_v1.3_GEMINI_SEM_CLOUD(1).zip' -d source

      - name: Apply Firebase AI initialization fix
        run: python scripts/fix_rvtec_v13_firebase_ai.py source/RVTEC_Android

      - name: Build debug APK
        working-directory: source/RVTEC_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-v1.3-Gemini-debug
          path: source/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
