name: Build RVTEC 1.4.8 com Biometria
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-rvtec-148-biometria.py'
      - '.github/workflows/build-rvtec-148-biometria.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair fonte original 1.4.7
        run: unzip -q RVTEC_1.4.7_COMPLETO_FONTE.zip -d buildsrc
      - name: Aplicar biometria e validar alterações
        run: |
          python3 scripts/patch-rvtec-148-biometria.py
          grep -q "versionName '1.4.8'" buildsrc/RVTEC_Android/app/build.gradle
          grep -q "rvtecBiometricLogin" buildsrc/RVTEC_Android/app/src/main/assets/index.html
          grep -q "authenticateBiometricLogin" buildsrc/RVTEC_Android/app/src/main/java/com/rvtec/manutencao/MainActivity.java
      - name: Compilar APK
        working-directory: buildsrc/RVTEC_Android
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../../gradle-build.log
      - name: Validar APK
        working-directory: buildsrc/RVTEC_Android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.8-LOG
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.4.8-APK-BIOMETRIA
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
