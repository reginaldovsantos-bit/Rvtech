name: Build RVTEC 1.6.6 sem botão de menu
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-rvtec-166.yml'
      - 'scripts/patch-rvtec-166.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar fonte RVTEC
        uses: actions/checkout@v4
      - name: Preparar fonte Android 1.6.5
        run: |
          unzip -q RVTEC_1.6.2_ALERTA_OS_FONTE.zip
          python3 scripts/patch-rvtec-163.py
          python3 scripts/patch-rvtec-164.py
          python3 scripts/patch-rvtec-165-biometria.py
      - name: Remover somente o botão hambúrguer e validar versão
        run: |
          python3 scripts/patch-rvtec-166.py
          grep -q "versionName '1.6.6'" RVTEC_Android/app/build.gradle
          grep -q "versionCode 166" RVTEC_Android/app/build.gradle
          grep -q "rvtecBiometricLogin" RVTEC_Android/app/src/main/assets/index.html
          grep -q "class GeminiBridge" RVTEC_Android/app/src/main/java/com/rvtec/manutencao/MainActivity.java
          grep -q "Firebase" RVTEC_Android/app/src/main/java/com/rvtec/manutencao/MainActivity.java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: RVTEC_Android
        run: |
          set +e
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log
          result=${PIPESTATUS[0]}
          exit "$result"
      - name: Validar APK
        working-directory: RVTEC_Android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Publicar log da compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.6.6-LOG-COMPILACAO
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.6.6-APK
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
