name: Inspecionar fonte RVTEC 1.8.5
on:
  push:
    branches: [ main, feature/rvtec-2.0-native-legacy-integration ]
    paths:
      - '.github/workflows/inspect-rvtec-185.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e inventariar pacote 1.8.5
        run: |
          set -euo pipefail
          unzip -t RVTEC_1.8.5_SEM_BOTAO_MENU.zip
          echo '--- ARQUIVOS DO PACOTE ---'
          unzip -Z1 RVTEC_1.8.5_SEM_BOTAO_MENU.zip
          mkdir -p /tmp/rvtec185
          unzip -q RVTEC_1.8.5_SEM_BOTAO_MENU.zip -d /tmp/rvtec185
          echo '--- ESTRUTURA ---'
          find /tmp/rvtec185 -maxdepth 4 -type f -printf '%p %s bytes\\n' | sort
          echo '--- ARQUIVOS ANDROID ---'
          find /tmp/rvtec185 -type f \\( -name 'build.gradle' -o -name 'settings.gradle' -o -name 'gradlew' -o -name 'AndroidManifest.xml' \\) -print
          echo '--- METADADOS E FUNCIONALIDADES ---'
          grep -RniE '<title>|firebase|gemini|manifest|serviceWorker|localStorage|QRCode|preventives|technicalMemory|stock|notifications' /tmp/rvtec185 --include='*.html' --include='*.js' --include='*.json' | head -160 || true
          echo '--- LEIA-ME ---'
          find /tmp/rvtec185 -iname 'LEIA-ME*' -exec cat {} \\; || true
