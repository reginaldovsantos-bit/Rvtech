name: Build RVTEC Gemini Cloudflare APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RVTEC_Android_v1.2_CLOUDFLARE.zip'
      - '.github/workflows/build-cloudflare.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Cloudflare project
        run: unzip -o RVTEC_Android_v1.2_CLOUDFLARE.zip -d .

      - name: Compile APK
        run: gradle -p RVTEC_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-GEMINI-CLOUDFLARE-APK
          path: RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
