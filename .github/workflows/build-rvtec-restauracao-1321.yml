name: Restaurar referência RVTEC 1.3.3 - marco 21-11 01:21

on:
  workflow_dispatch:
  push:
    branches:
      - rvtec-restauracao-2026-11-21-0121

permissions:
  contents: read

jobs:
  restore-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar fonte de referência
        run: |
          set -euo pipefail
          test -s RVTEC_Android_v1.3.3_GEMINI_APPCHECK.zip
          sha256sum RVTEC_Android_v1.3.3_GEMINI_APPCHECK.zip
          unzip -t RVTEC_Android_v1.3.3_GEMINI_APPCHECK.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair fonte original 1.3.3
        run: unzip -o RVTEC_Android_v1.3.3_GEMINI_APPCHECK.zip -d buildsrc

      - name: Diagnóstico técnico antes da correção
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          echo '===== app/build.gradle ====='
          cat app/build.gradle
          echo '===== MainActivity.java linhas 1-75 ====='
          sed -n '1,75p' app/src/main/java/com/rvtec/manutencao/MainActivity.java

      - name: Validar estrutura e integração nativa
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          grep -R -n "RVTECNative" app/src/main
          grep -R -n -E "FirebaseAI|Firebase AI|AppCheck|PlayIntegrity" app/src/main || true

      - name: Corrigir geração do BuildConfig no projeto extraído
        working-directory: buildsrc/RVTEC_Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          if 'buildFeatures' not in s:
              marker = "android {\\n"
              if marker not in s:
                  raise SystemExit('Bloco android não encontrado; nenhuma alteração aplicada')
              s = s.replace(marker, marker + "    buildFeatures { buildConfig true }\\n", 1)
          elif 'buildConfig true' not in s:
              raise SystemExit('buildFeatures já existe, mas buildConfig não está habilitado; revisão manual necessária')
          p.write_text(s)
          assert 'buildConfig true' in p.read_text()
          print('BuildConfig habilitado explicitamente para AGP 8+')
          PY

      - name: Compilar APK de referência
        working-directory: buildsrc/RVTEC_Android
        run: gradle assembleDebug

      - name: Publicar APK de restauração para teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RVTEC-1.3.3-REFERENCIA-21-11-0121
          path: buildsrc/RVTEC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
