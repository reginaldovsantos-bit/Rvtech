name: RVTEC 2.0 - Android validation
on:
  pull_request:
    branches:
      - integration/rvtec-2.0-alpha05-ui-centralized
    paths:
      - 'rvtec-2.0/**'
      - '.github/workflows/rvtec2-build.yml'
  push:
    paths:
      - 'rvtec-2.0/**'
      - '.github/workflows/rvtec2-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug APK
        working-directory: rvtec-2.0
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rvtec-2.0-debug
          path: rvtec-2.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
